name: PRIME CLIENT — Build and Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, tests, and source build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.1'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck application and Electron code
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build renderer and Electron sources
        run: npm run build:renderer && npm run build:electron

  desktop-build:
    name: Build desktop app (${{ matrix.os }})
    needs: checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: dist:win
          - os: ubuntu-latest
            command: dist:linux
          - os: macos-latest
            command: dist:mac
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.1'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Prevent electron-builder from trying to publish directly. Artifacts are
      # uploaded below; tagged builds are published by the release job instead.
      - name: Package desktop application without auto-publishing
        run: npm run ${{ matrix.command }} -- --publish never

      - name: Upload desktop installers
        uses: actions/upload-artifact@v4
        with:
          name: prime-client-desktop-${{ matrix.os }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  mod-build:
    name: Optional Minecraft mod source build
    runs-on: ubuntu-latest
    env:
      MOD_SOURCE_DIR: ${{ vars.MOD_SOURCE_DIR }}
      MOD_JAVA_VERSION: ${{ vars.MOD_JAVA_VERSION }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java for supplied mod source
        if: ${{ env.MOD_SOURCE_DIR != '' && env.MOD_JAVA_VERSION != '' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.MOD_JAVA_VERSION }}

      - name: Build mod only when source is configured
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${MOD_SOURCE_DIR:-}" ]]; then
            echo "No MOD_SOURCE_DIR repository variable configured; no mod source was supplied. Skipping mod build."
            echo "Optional mod build skipped; no JAR was produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          case "$MOD_SOURCE_DIR" in
            /*|*..*) echo "MOD_SOURCE_DIR must be a safe repository-relative path." >&2; exit 1 ;;
          esac
          if [[ -z "${MOD_JAVA_VERSION:-}" ]]; then
            echo "Set repository variable MOD_JAVA_VERSION to the Java major version required by the mod." >&2
            exit 1
          fi
          test -d "$MOD_SOURCE_DIR" || { echo "Configured source directory not found: $MOD_SOURCE_DIR" >&2; exit 1; }
          if [[ -f "$MOD_SOURCE_DIR/gradlew" ]]; then
            chmod +x "$MOD_SOURCE_DIR/gradlew"
            (cd "$MOD_SOURCE_DIR" && ./gradlew --no-daemon build)
          else
            echo "No Gradle Wrapper found at $MOD_SOURCE_DIR; refusing to guess a Gradle version." >&2
            exit 1
          fi
          mkdir -p mod-artifacts
          while IFS= read -r jar; do
            relative="${jar#"$MOD_SOURCE_DIR"/}"
            safe_name="${relative//\//__}"
            cp "$jar" "mod-artifacts/$safe_name"
          done < <(find "$MOD_SOURCE_DIR" -type d \( -name .git -o -name .gradle -o -name node_modules \) -prune -o -path '*/build/libs/*.jar' -type f -size +4c -print)
          shopt -s nullglob
          jars=(mod-artifacts/*.jar)
          if (( ${#jars[@]} == 0 )); then
            echo "Gradle finished but no non-empty JAR was found under build/libs." >&2
            exit 1
          fi
          printf 'Built mod artifacts:\n' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "${jars[@]}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload built mod JAR
        if: ${{ env.MOD_SOURCE_DIR != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: prime-client-mod-jar
          path: mod-artifacts/*.jar
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop-build, mod-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download desktop build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: prime-client-desktop-*
          path: release-assets
          merge-multiple: true

      - name: Download mod JAR if one was built
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: prime-client-mod-jar
          path: release-assets/mod

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/**
